<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso Importante</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            text-align: center;
            color: #fff;
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #00c853;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background: #009624;
            transform: scale(1.05);
        }

        .assinatura {
            margin-top: 25px;
            font-size: 0.95rem;
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.4rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚠️ Atenção Alunos</h1>
        <p>O novo link da plataforma é:</p>
        <a href="https://confianopai.ia.br/" target="_blank">
            Acessar Plataforma
        </a>

        <div class="assinatura">
            Atenciosamente,<br>
            <strong>Alan Ricardo</strong>
        </div>
    </div>

</body>
</html>
